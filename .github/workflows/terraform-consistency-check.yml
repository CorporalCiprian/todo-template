on:
    workflow_call:
        secrets:
            AZURE_CLIENT_ID:
                required: true
            AZURE_SUBSCRIPTION_ID:
                required: true
            AZURE_TENANT_ID:
                required: true
        inputs:
            env:
                required: true
                type: string

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./terraform
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: Azure login
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}

            - name: Terraform setup
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_wrapper: false

            - name: Terraform init
              run: terraform init -backend-config="backends/${{inputs.env}}.hcl" -upgrade

            - name: Terraform plan
              run: |
                set +e
                terraform plan -detailed-exitcode -input=false -var-file="environments/${{inputs.env}}.tfvars" 
                exit_code=$?
                set -e
                echo "$exit_code"
                if [[ $exit_code == 0 ]]; then
                    echo "no changes in state"
                elif [[ $exit_code == 2 ]]; then
                    echo "state drift"
                    exit 1
                else
                    echo "plan error"
                    exit 1
                fi 