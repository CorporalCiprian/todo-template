on: 
  workflow_call:
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
    inputs:
      env:
        required: true
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_diff: ${{ steps.plan_output.outputs.plan_diff }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init -backend-config="backends/${{inputs.env}}.hcl" -upgrade

      - name: Terraform plan
        id: plan_output
        run: | 
          terraform plan -input=false -var-file="environments/${{inputs.env}}.tfvars" -detailed-exitcode tee plan.txt | tee plan.txt
          exit_code=$?
          
          if [[ exit_code == 0 ]]; then
            echo "plan_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "plan_diff=true" >> "GITHUB_OUTPUT"
          fi 
      
      - name: Print job summary
        uses: sgametrio/terraform-summary-action@v1.1
        with:
          log-file: ./terraform/plan.txt
          title: Plan Summary

  apply:
    needs: plan
    if: ${{ needs.plan.outputs.plan_diff == true }}
    name: Terraform init + apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    environment: ${{ inputs.env }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}


      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init -backend-config="backends/${{inputs.env}}.hcl"

      - name: Terraform apply
        run: terraform apply -auto-approve -var-file="environments/${{inputs.env}}.tfvars"