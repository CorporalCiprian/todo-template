on: 
  workflow_call:
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
    inputs:
      env:
        required: true
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_diff: ${{ steps.plan_output.outputs.plan_diff }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend-config="backends/${{inputs.env}}.hcl" -upgrade

      - name: Terraform plan
        id: plan_output
        run: | 
          set +e
          terraform plan -detailed-exitcode -input=false -var-file="environments/${{inputs.env}}.tfvars" -out=tfplan
          exit_code=$?
          set -e
          echo "$exit_code"
          if [[ $exit_code == 0 ]]; then
            echo "plan_diff=false" >> "$GITHUB_OUTPUT"
          elif [[ $exit_code == 2 ]]; then
            echo "plan_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "plan error"
            exit 1
          fi 
        
      - name: Artifact plan
        uses: actions/upload-artifact@v7
        with:
          path: terraform/tfplan
          archive: false 
          retention-days: 1
    
  apply:
    needs: plan
    if: ${{ needs.plan.outputs.plan_diff == 'true' }}
    name: Terraform init + apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    environment: ${{ inputs.env }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}


      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init -backend-config="backends/${{inputs.env}}.hcl"

      - name: Download plan
        uses: actions/download-artifact@v8
        with: 
          path: terraform

      - name: Terraform apply
        run: terraform apply -auto-approve -var-file="environments/${{inputs.env}}.tfvars" tfplan