name: Docker Build
on:
  workflow_call:
    inputs:
      AZURE_CONTAINER_REGISTRY:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: null
    secrets:
      AZURE_REGISTRY_USERNAME:
        required: true
      AZURE_REGISTRY_PASSWORD:
        required: true
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: get_pushed_tag
        id: get_latest_tag
        run: |
          git fetch --tags --force
          latest_tag=$(git tag -l --sort=-v:refname | head -n 1)
          if [[ -z $latest_tag ]]; then
            latest_tag='v0.0.0'
          fi
          if [ ${{inputs.tag}} != null ]; then
            latest_tag=${{ inputs.tag }}
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
           
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push to ACR
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ inputs.AZURE_CONTAINER_REGISTRY }}.azurecr.io/backend:${{ steps.get_latest_tag.outputs.tag }}
          provenance: false
          


      